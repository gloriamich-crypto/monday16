<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
.studentform{
    background-color: rgb(179, 145, 212);
    padding:20px;
    border-radius: 10px;
    font-family: 'Times New Roman', Times, serif;
    color: white;
}
</style>
<body>
    <h1>Student Data Collection Form</h1>
    <form action="" class="studentform">
        <label for="name">Name:</label>
        <input type="text" id="name" name="student-name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="student-email">
        <br><br>
        <label  for="phone">Phone:</label>
        <input type="number" id="phone" name="student-phone">
        <br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="student-age">
        <br><br>
        <button type="submit" class="btn">Submit</button>
    </form>
    <h2>Submitted Student Data</h2>
    <table class="studentdata">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Age</th>
        </tr>
        <tr>
            <th>John Doe</th>
            <th>johndoe@gmail.com</th>
            <th>123456789</th>
            <th>22</th>
        </tr>
        <tr>
            <th>Jane Doe</th>
            <th>janedoe@gmail.com</th>
            <th>987654321</th>
            <th>22</th>

        </tr>
        </table>
    
</body>
</html>
